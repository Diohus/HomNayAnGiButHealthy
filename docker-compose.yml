services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homnayangi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-homnayangi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homnayangi}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh  # "hôm nay" của chatbot theo giờ Việt Nam
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-homnayangi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-homnayangi}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    depends_on:
      - backend

  # HTTPS: SITE_ADDRESS=localhost dùng chứng chỉ nội bộ của Caddy; đặt tên miền thật để Caddy tự lấy chứng chỉ.
  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend

volumes:
  pgdata:
  caddy_data:
