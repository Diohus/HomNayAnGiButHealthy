server {
  listen 80;
  access_log off;  # không lưu log truy cập (tránh dữ liệu sức khỏe trong URL)
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # IP thật cho rate limit
    proxy_read_timeout 60s;
    client_max_body_size 6m;  # ảnh chỉ định của bác sĩ ≤ 5 MB (mặc định nginx 1 MB)
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
  }
}
